server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/demo_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

app:
  jwt:
    secret: ${JWT_SECRET:c2VjcmV0S2V5VGVtcGxhdGVJbmljaWFsRmluYWwwMVVpc3JhZWxQcm95ZWN0b3NKV1RTZWd1cmlkYWQ=}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    issuer: uisrael-backend

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging:
  config: classpath:log4j2.xml
